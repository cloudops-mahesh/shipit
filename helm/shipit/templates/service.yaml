apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:                          # send traffic to pods carrying this label
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}   # the Service listens on 80
      targetPort: http                   # and forwards to the container's port named "http" (3000)